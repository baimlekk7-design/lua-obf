name: build luajit
on:
  workflow_dispatch:
  push:
    paths: ['api/obfuscate.py', '.github/workflows/build.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4

      - name: cek binary
        id: chk
        run: |
          if [ -x api/luajit ]; then echo "exists=true" >> $GITHUB_OUTPUT
          else echo "exists=false" >> $GITHUB_OUTPUT; fi

      - name: build luajit
        if: steps.chk.outputs.exists == 'false'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential git
          git clone --depth 1 https://github.com/LuaJIT/LuaJIT /tmp/lj
          cd /tmp/lj
          make -j$(nproc)
          strip src/luajit
          cp src/luajit $GITHUB_WORKSPACE/api/luajit
          chmod +x $GITHUB_WORKSPACE/api/luajit

      - name: commit
        if: steps.chk.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/luajit
          git commit -m "chore: build luajit binary"
          git push
