<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>luajit obf</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0b0d;--panel:#101216;--line:#1c1f25;--fg:#e5e7eb;--mut:#6b7280;--dim:#3d434d;--acc:#00e5a0}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:13px/1.5 -apple-system,BlinkMacSystemFont,"Inter",system-ui,sans-serif;display:grid;place-items:center;padding:20px}
.box{width:100%;max-width:820px;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.hd{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:12px;color:var(--mut)}
.hd b{color:var(--fg);font-weight:500}
.hd .sp{flex:1}
.hd kbd{background:#181b20;border:1px solid var(--line);border-radius:3px;padding:1px 5px;font:10px ui-monospace,monospace;color:var(--dim)}
.grid{display:grid;grid-template-columns:1fr 1fr;min-height:0}
@media(max-width:640px){.grid{grid-template-columns:1fr}}
.pane{display:flex;flex-direction:column;min-height:0}
.pane+.pane{border-left:1px solid var(--line)}
@media(max-width:640px){.pane+.pane{border-left:0;border-top:1px solid var(--line)}}
.ph{padding:7px 14px;font-size:11px;color:var(--dim);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:7px}
.ph .d{width:5px;height:5px;border-radius:50%;background:var(--dim)}
.ph.on .d{background:var(--acc)}
.ph .sp{flex:1}
.ph .n{font-family:ui-monospace,monospace;font-size:10px;color:var(--dim)}
textarea,pre{height:250px;background:transparent;border:0;outline:0;color:var(--fg);padding:12px 14px;font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;resize:none;overflow:auto}
pre{white-space:pre-wrap;word-break:break-all;color:#c5cad1}
textarea::placeholder{color:var(--dim)}
::-webkit-scrollbar{width:7px;height:7px}
::-webkit-scrollbar-thumb{background:#242830;border-radius:7px}
.ft{display:flex;align-items:center;gap:7px;padding:9px 14px;border-top:1px solid var(--line)}
.chk{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--mut);cursor:pointer;user-select:none}
.chk input{accent-color:var(--acc)}
.sp{flex:1}
button{background:#171a1f;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 12px;font:inherit;font-size:12px;cursor:pointer}
button:hover{background:#1e222a}
button:active{transform:translateY(.5px)}
button.p{background:var(--acc);color:#001a10;border-color:var(--acc);font-weight:600}
button.p:hover{background:#19f7ad}
button:disabled{opacity:.4;cursor:not-allowed}
#s{margin-left:auto;font-size:11.5px;color:var(--mut)}
#s.ok{color:var(--acc)}
#s.err{color:#ff6b6b}
.tabs{display:flex;gap:4px;padding:6px 14px 0;font-size:11px}
.tab{padding:3px 8px;border-radius:4px;color:var(--dim);cursor:pointer;border:1px solid transparent}
.tab.on{color:var(--fg);background:#181b20;border-color:var(--line)}
</style>
</head>
<body>
<div class="box">
  <div class="hd"><b>luajit obf</b><span>· x64 linux</span><span class="sp"></span><span>ctrl <kbd>↵</kbd></span></div>
  <div class="grid">
    <div class="pane">
      <div class="ph"><span class="d"></span>source lua<span class="sp"></span><span class="n" id="ci">0</span></div>
      <textarea id="i" spellcheck="false" placeholder="-- tempel kode lua, terus gas"></textarea>
    </div>
    <div class="pane">
      <div class="ph" id="ph2"><span class="d"></span>bytecode<span class="sp"></span><span class="n" id="co">0 B</span></div>
      <div class="tabs">
        <div class="tab on" data-f="lua">lua</div>
        <div class="tab" data-f="hex">hex</div>
        <div class="tab" data-f="b64">b64</div>
      </div>
      <pre id="o">// belum ada apa-apa</pre>
    </div>
  </div>
  <div class="ft">
    <label class="chk"><input type="checkbox" id="strip" checked> strip debug</label>
    <span class="sp"></span>
    <button class="p" id="go">gas</button>
    <button id="dl" disabled>download .luac</button>
    <button id="cl">reset</button>
    <span id="s"></span>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
const st=(t,c='')=>{$('s').textContent=t;$('s').className=c};
const fm=n=>n<1024?n+' B':(n/1024).toFixed(1)+' KB';
let RES=null, VIEW='lua';
$('i').oninput=()=>$('ci').textContent=$('i').value.length.toLocaleString('id-ID');
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
  t.classList.add('on'); VIEW=t.dataset.f; render();
});
function render(){ $('o').textContent = RES ? RES[VIEW] : '// belum ada apa-apa' }
async function run(){
  const code=$('i').value;
  if(!code.trim()){st('isi dulu bos','err');return}
  $('go').disabled=true;st('ngobfuscate...');$('ph2').classList.remove('on');
  try{
    const r=await fetch('/api/obfuscate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code,strip:$('strip').checked})});
    const j=await r.json();
    if(!j.ok){st(j.error||'gagal','err');$('o').textContent='// error:\n'+(j.error||'');RES=null;$('dl').disabled=true}
    else{RES=j;$('co').textContent=fm(j.size);st('beres','ok');$('ph2').classList.add('on');$('dl').disabled=false;render()}
  }catch(e){st('konek gagal','err')}
  $('go').disabled=false;
}
function dl(){
  if(!RES)return;
  const bin=atob(RES.b64),u=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([u],{type:'application/octet-stream'}));
  a.download='out.luac';a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function cl(){
  $('i').value='';$('ci').textContent='0';$('co').textContent='0 B';
  RES=null;$('o').textContent='// belum ada apa-apa';
  $('ph2').classList.remove('on');st('');$('dl').disabled=true;$('i').focus();
}
$('go').onclick=run;$('cl').onclick=cl;$('dl').onclick=dl;
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();run()}});
$('i').focus();
</script>
</body>
</html>
